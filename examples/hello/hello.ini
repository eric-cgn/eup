; Hello: a small example of an EUP installer. It installs a Read Me and a folder of samples, all
; plain text, and shows both optional screens: a description of the software, and a license.
;
;   eup build examples/hello -o dist

[installer]
product = Hello
version = 1.0
get_info = Hello 1.0 installer, an EUP example.
description_screen = About Hello.txt
license_screen = License.txt

[type easy]
label = Easy Install
description = The Read Me and the samples.

[type custom]
label = Custom Install
custom = yes

[group docs]
label = Documents
selectable = yes

[component readme]
group = docs
label = Hello Read Me
description = What Hello is.
source = Files:Hello Read Me.txt
as = Hello Read Me
text = yes
types = easy, custom

[component samples]
group = docs
label = Samples
description = Three short texts.
source = Files:Samples
destination = %chosen%:Samples
text = yes
types = easy, custom

[layout]
window = 40, 60, 300, 160
place = Hello Read Me: 18, 9
place = Samples: 108, 9
