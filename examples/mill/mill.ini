; Install Mill, made with EUP: Mill 2.0.1's installer, with a Minimal Install added. The files
; themselves are not in this repository; README says where they come from.
;
;   eup build examples/mill -o dist

[installer]
product = Mill
version = 2.0.1
get_info = Install Mill 2.0.1, © 2026 OneInAMillion Software. Freeware.
creator = MiLI
icon = Install icon.bin

[type easy]
label = Easy Install
description_file = Easy Install.txt

[type minimal]
label = Minimal Install
description = Mill alone. Plug-Ins can be added later with Custom Install.
remove_old = no

[type custom]
label = Custom Install
custom = yes

[group application]
label = Application

[group plugins]
label = Plug-Ins
selectable = yes

[group developer]
label = Developer

[component mill]
group = application
label = Mill
description = The web browser.
source = Mill.bin
flags = bundle
types = easy, minimal, custom

[component internet-services]
group = plugins
label = Internet Services
description = Finger, Whois, Dict, Time, FTP, and Gopher.
source = Internet Services.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component web-fonts]
group = plugins
label = Web Fonts
description = Serif and Mono bitmaps at every HTML size.
source = Web Fonts.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component sdk]
group = developer
label = Mill Plug-In SDK
description = Files for writing Mill Plug-Ins, for CodeWarrior 4 and MPW 3.4.
source = Mill Plug-In SDK
destination = %chosen%:Mill Plug-In SDK
text = yes
types = custom

[upgrade]
detect = Mill
remove = %chosen%:Mill Fonts
remove = %chosen%:Mill Fonts Read Me
remove = %chosen%:Mill Plug-Ins:Finger
keep = Mill Settings

[layout]
window = 40, 60, 300, 190
place = Mill: 18, 9
place = Mill Plug-Ins: 108, 79
place = Mill Plug-In SDK: 198, 79
